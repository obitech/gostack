name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # Library packages (root module)
  # ──────────────────────────────────────────────────────────────
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # ──────────────────────────────────────────────────────────────
  # Full-stack template (templates/full module)
  # ──────────────────────────────────────────────────────────────
  template-go:
    name: Template / Go
    runs-on: ubuntu-latest
    # Build against the gostack version the template requires, not the local
    # library from go.work. That is what a scaffolded app gets.
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: templates/full
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: templates/full/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: templates/full

  template-frontend:
    name: Template / Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/full/web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: templates/full/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: templates/full/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  template-docker:
    name: Template / Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t gostack-template:ci templates/full

  # ──────────────────────────────────────────────────────────────
  # GoReleaser config validation
  # ──────────────────────────────────────────────────────────────
  check-goreleaser:
    name: GoReleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.20.3"
          args: check
